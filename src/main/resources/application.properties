# Identificacao da aplicacao
spring.application.name=gate-api

# ---------------------------------------------------------------------------
# Banco de dados local (H2, em arquivo, persiste entre execucoes)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/gateclickbus;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, util para inspecionar o banco durante o desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# ddl-auto=update: schema e criado/atualizado automaticamente a partir das
# entidades. Suficiente para o MVP (sem Flyway/Liquibase neste ciclo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Documentacao da API (Swagger/OpenAPI)
# Disponivel em http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Porta padrao do servidor
server.port=8080
